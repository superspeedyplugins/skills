# parallel-dev: one wildcard server block serves every site. The document root comes from the
# hostname, so creating a site directory is all it takes to create a site.
#
#   <scenario>.<plugin>.localhost:8081  ->  <sites root>/<plugin>/<scenario>
#   <plugin>.localhost:8081             ->  <sites root>/<plugin>/default
#
# setup.md fills in the double-underscore placeholders with sed. Change 8081 too if you
# changed PD_PORT.

server {
    listen 8081;
    server_name ~^(?<pd_scenario>[a-z0-9-]+)\.(?<pd_plugin>[a-z0-9-]+)\.localhost$;
    root __SITES_ROOT__/$pd_plugin/$pd_scenario;
    include __CONF_DIR__/parallel-dev-common.conf;
}

server {
    listen 8081;
    server_name ~^(?<pd_plugin_only>[a-z0-9-]+)\.localhost$;
    root __SITES_ROOT__/$pd_plugin_only/default;
    include __CONF_DIR__/parallel-dev-common.conf;
}

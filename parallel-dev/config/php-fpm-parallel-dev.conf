; parallel-dev PHP-FPM pool. Workers run as YOU, so they can read sites and the plugin
; repositories they symlink to. setup.md fills in the double-underscore placeholders.
[parallel-dev]
user = __USER__
group = __USER__

listen = __FPM_SOCKET__
listen.owner = __WEB_USER__
listen.group = __WEB_USER__
listen.mode = 0660

; A few warm workers. With pm = ondemand, the first request after a long CLI-only setup step
; waits for a worker to spawn, which shows up as random slow first requests in browser tests.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Any request slower than 10 s writes a stack trace, so a stall shows where it sits.
slowlog = /tmp/php-fpm-parallel-dev-slow.log
request_slowlog_timeout = 10s

catch_workers_output = yes
php_admin_flag[log_errors] = on
